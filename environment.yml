name: lung_nodule
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core environment
  - python=3.9
  - pip
  
  # PyTorch and CUDA support (adjust for your GPU; remove pytorch-cuda if no GPU is available)
  - pytorch==2.1.0
  - torchvision==0.16.0
  - pytorch-cuda=11.8 
  
  # Install core scientific computing packages with conda for better compatibility with underlying C/C++ libraries
  - numpy=1.26.0
  - pandas=2.1.1
  - scikit-learn=1.3.1
  - scipy=1.11.3
  - matplotlib=3.8.0
  - seaborn=0.13.0
  
  # Install the remaining medical-specific and frequently updated packages with pip
  - pip:
    - pytorch-lightning==2.1.0
    - tensorboard==2.14.0
    - SimpleITK==2.3.1
    - pydicom==2.4.3
    - scikit-image==0.22.0
    - PyYAML==6.0.1
    - streamlit>=1.39,<2
